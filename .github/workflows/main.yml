name: IT之家 Daily Posts

on:
  schedule:
    - cron: '0 5 * * *'   # 08:00 МСК
    - cron: '0 8 * * *'   # 11:00 МСК
    - cron: '0 11 * * *'  # 14:00 МСК
    - cron: '0 14 * * *'  # 17:00 МСК
    - cron: '0 16 * * *'  # 19:00 МСК
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Run script
        env:
          # Эти названия должны совпадать с тем, что написано в Python-коде (os.getenv)
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python scripts/fetch_news.py

      # ⚠️ ВАЖНО: Сохраняем файл с отправленными новостями, чтобы не было повторов
      - name: Commit sent.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sent.json || true
          git diff --cached --quiet || git commit -m "chore: update sent.json [skip ci]"
          git push || true
