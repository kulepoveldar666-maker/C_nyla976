name: IT之家 Daily Posts

on:
  schedule:
    # Время в UTC (МСК минус 3 часа)
    - cron: '0 5 * * *'   # 08:00 МСК (Android)
    - cron: '0 8 * * *'   # 11:00 МСК (Apple)
    - cron: '0 11 * * *'  # 14:00 МСК (Windows)
    - cron: '0 14 * * *'  # 17:00 МСК (Android)
    - cron: '0 16 * * *'  # 19:00 МСК (Apple)
  workflow_dispatch: {}   # Позволяет запустить вручную для проверки

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Run script
        run: python scripts/fetch_news.py
